[build]
  base    = "voice-agent-trial"
  publish = "public"
  command = "echo 'No build step required'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from   = "https://www.boost-houseco.com/*"
  to     = "https://boost-houseco.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "max-age=3600"
