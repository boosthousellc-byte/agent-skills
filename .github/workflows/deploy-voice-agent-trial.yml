name: Deploy Voice Agent Trial to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'voice-agent-trial/**'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Firebase (boosthouse-demo-portal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voice-agent-trial/functions/package.json

      - name: Install function dependencies
        run: npm install
        working-directory: voice-agent-trial/functions

      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --project boosthouse-demo-portal --non-interactive
        working-directory: voice-agent-trial
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
